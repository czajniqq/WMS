[server]
url = http://127.0.0.1:8000
# Set to false only for dev with self-signed certs; always true in production
tls_verify = true
# api_key = change-me-in-production

[agent]
version = 1.0.0

[intervals]
metrics_seconds = 60
logs_seconds = 300
heartbeat_seconds = 120

[thresholds]
min_log_level = WARNING

[retry]
max_retries = 3
backoff_seconds = 5
