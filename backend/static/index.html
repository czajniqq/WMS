<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitoring Dashboard</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <h1>🖥 LAN Monitoring Dashboard</h1>
      <div class="badge-container">
        Active Alerts: <span id="alerts-badge" class="badge badge-danger">0</span>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Agents -->
    <section class="card" id="agents-section">
      <h2>Agents</h2>
      <table id="agents-table">
        <thead>
          <tr>
            <th>Hostname</th><th>IP Address</th><th>Version</th>
            <th>Last Seen</th><th>Status</th>
          </tr>
        </thead>
        <tbody id="agents-tbody"></tbody>
      </table>
    </section>

    <!-- Agent Detail -->
    <section class="card" id="agent-detail" style="display:none;">
      <h2 id="detail-hostname">Agent Detail</h2>
      <div class="charts-row">
        <div class="chart-container">
          <h3>CPU %</h3>
          <canvas id="cpu-chart"></canvas>
        </div>
        <div class="chart-container">
          <h3>RAM %</h3>
          <canvas id="ram-chart"></canvas>
        </div>
      </div>
    </section>

    <!-- Logs -->
    <section class="card" id="logs-section">
      <h2>Logs</h2>
      <div class="filter-row">
        <select id="log-agent-select"><option value="">All Agents</option></select>
        <select id="log-level-select">
          <option value="">All Levels</option>
          <option value="CRITICAL">CRITICAL</option>
          <option value="ERROR">ERROR</option>
          <option value="WARNING">WARNING</option>
          <option value="INFORMATION">INFORMATION</option>
          <option value="AUDIT_FAILURE">AUDIT_FAILURE</option>
        </select>
        <input type="datetime-local" id="log-from" placeholder="From" />
        <input type="datetime-local" id="log-to" placeholder="To" />
        <button id="log-apply-btn" class="btn">Apply Filters</button>
      </div>
      <table id="logs-table">
        <thead>
          <tr>
            <th>Time</th><th>Level</th><th>Source</th>
            <th>Event ID</th><th>Message</th>
          </tr>
        </thead>
        <tbody id="logs-tbody"></tbody>
      </table>
    </section>

    <!-- Alerts -->
    <section class="card" id="alerts-section">
      <h2>Active Alerts</h2>
      <table id="alerts-table">
        <thead>
          <tr>
            <th>Agent ID</th><th>Rule</th><th>Threshold</th>
            <th>Actual</th><th>Triggered At</th><th>Action</th>
          </tr>
        </thead>
        <tbody id="alerts-tbody"></tbody>
      </table>
    </section>
  </main>

  <script src="/static/chart.min.js"></script>
  <script src="/static/chart_helpers.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
